name: JPV-OS Production Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pull-request:
    name: Verify JPV-OS Pull Request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build

  verify-trusted-production-build:
    name: Verify Trusted JPV-OS Production Build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, jpv-os]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build

      - name: Verify production health endpoint
        run: |
          $Response = Invoke-WebRequest -Uri "https://jaypv-os.jaypventuresllc.com/health.json" -UseBasicParsing
          $Response.Content
          if ($Response.StatusCode -ne 200) {
            throw "Health check failed with status $($Response.StatusCode)"
          }
